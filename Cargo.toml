[package]
name = "hakobo"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Hakobo – lokale Notizen als Outline mit Todos, Terminen und automatischer Git-Versionierung"
default-run = "hakobo"

[[bin]]
name = "hakobo"
path = "src/main.rs"

[dependencies]
# Web-Server
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["compression-gzip"] }
rust-embed = { version = "8", features = ["include-exclude"] }
mime_guess = "2"
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }

# Git: lokal über libgit2, Netzwerk über die git-CLI
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }

# Suche
nucleo-matcher = "0.3"

# Diverses
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
open = "5"
rand = "0.9"
walkdir = "2"
notify = "8"
regex = "1"
ureq = { version = "2", default-features = false, features = ["json"] }

# Natives App-Fenster, Tray, globaler Hotkey (WebView2 unter Windows, WKWebView unter macOS)
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tao = { version = "0.37", default-features = false, features = ["rwh_06"] }
wry = { version = "0.57", default-features = false }
tray-icon = "0.26"
global-hotkey = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
tauri-winrt-notification = "0.8"

[target.'cfg(not(windows))'.dependencies]
notify-rust = "4"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
